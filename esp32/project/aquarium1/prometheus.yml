global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'tasmota_esp32'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.12.71:80'] # Ganti sama IP ESP32 kamu

  - job_name: 'blackbox_ping'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - cloudflare.com
          - 192.168.12.1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
